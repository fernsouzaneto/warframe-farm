<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warframe Farm Planner</title>
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231B1B1B'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='20' fill='%23D89B2B'%3EW%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-logo">
        <div class="header-logo-icon">W</div>
        <span class="header-title">Warframe Farm Planner</span>
      </div>
      <div class="header-search">
        <span class="header-search-icon">&#128269;</span>
        <input type="text" id="searchInput" placeholder="Pesquisar por nome, planeta, missao..." autocomplete="off">
      </div>
      <div class="header-progress" id="progressText">
        <div class="progress-ring">
          <svg viewBox="0 0 36 36" class="progress-svg">
            <path class="progress-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            <path class="progress-fill-ring" id="progress-ring-fill" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" stroke-dasharray="0, 100"/>
          </svg>
          <span class="progress-ring-label" id="progress-label">0%</span>
        </div>
        <div class="header-progress-text">
          <div class="progress-count" id="progress-detail"><span class="num">0</span>/<span class="total">0</span></div>
          <div class="progress-sub">concluidos</div>
        </div>
      </div>
      <div class="header-progress prime-progress" id="primeProgressText">
        <div class="progress-ring">
          <svg viewBox="0 0 36 36" class="progress-svg">
            <path class="progress-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            <path class="progress-fill-ring prime-fill" id="prime-ring-fill" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" stroke-dasharray="0, 100"/>
          </svg>
          <span class="progress-ring-label" id="prime-progress-label">0%</span>
        </div>
        <div class="header-progress-text">
          <div class="progress-count" id="prime-progress-detail"><span class="num">0</span>/<span class="total">0</span></div>
          <div class="progress-sub">prime</div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="stats-panel"></div>

    <div class="tab-bar">
      <button class="tab-btn active" data-tab="warframes">Warframes</button>
      <button class="tab-btn" data-tab="primes">Warframes Prime</button>
    </div>

    <div class="filters">
      <button class="chip active" data-filter="all">Todos</button>
      <button class="chip" data-filter="boss">Boss</button>
      <button class="chip" data-filter="quest">Quest</button>
      <button class="chip" data-filter="granum">Granum</button>
      <button class="chip" data-filter="mirror defense">Mirror</button>
      <button class="chip" data-filter="open world">Open World</button>
      <button class="chip" data-filter="syndicate">Syndicate</button>
      <button class="chip" data-filter="dojo">Dojo</button>
      <button class="chip" data-filter="disruption">Disruption</button>
      <button class="chip" data-filter="spy">Spy</button>
      <button class="chip" data-filter="ascension">Ascension</button>
      <button class="chip" data-filter="pending">Pendentes</button>
      <button class="chip" data-filter="completed">Concluidos</button>
      <button class="chip" data-filter="favoritos">&#9733; Favoritos</button>
      <button class="chip prime-only" data-filter="vaulted">Vaulted</button>
      <button class="chip prime-only" data-filter="available">Disponivel</button>
    </div>

    <div class="sort-row">
      <span class="sort-label">Ordenar:</span>
      <button class="sort-btn active" data-sort="name">Nome</button>
      <button class="sort-btn" data-sort="planet">Planeta</button>
      <button class="sort-btn" data-sort="parts">Pecas</button>
    </div>

    <div id="warframeGrid" class="grid"></div>
  </main>

  <footer style="text-align:center;padding:2rem 1rem;color:var(--text-muted);font-size:0.8125rem;border-top:1px solid var(--border);margin-top:2rem;">
    <div style="display:flex;justify-content:center;gap:1rem;align-items:center;flex-wrap:wrap;max-width:1400px;margin:0 auto;">
      <span>Warframe Farm Planner &mdash; Aplicacao offline</span>
      <span style="color:var(--border-light);">|</span>
      <button id="clearStorage" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-family:inherit;font-size:0.8125rem;text-decoration:underline;padding:0;" title="Limpar todo o progresso salvo">Limpar Progresso</button>
    </div>
  </footer>
